[project]
name = "freeterm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["textual", "textual-plotext", "plotext", "yfinance", "pandas", "numpy",
                "httpx", "websockets", "feedparser", "beautifulsoup4", "lxml"]

[project.scripts]
ft = "freeterm.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["freeterm"]

[tool.setuptools.package-data]
freeterm = ["*.tcss"]
